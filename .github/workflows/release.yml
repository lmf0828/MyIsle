name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 0.2.0；留空则用 Cargo.toml）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      LINGDAO_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if (-not $v) { $v = "${{ github.ref_name }}".TrimStart('v') }
          if (-not $v) {
            $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          }
          Write-Host "VERSION=$v"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Set version files
        shell: pwsh
        run: ./scripts/set_version.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Build (release)
        shell: pwsh
        run: |
          cargo build --release
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed" }

      - name: Unit tests
        shell: pwsh
        run: |
          cargo test --release
          if ($LASTEXITCODE -ne 0) { throw "cargo test failed" }

      - name: Code sign app exe (optional)
        if: ${{ secrets.WINDOWS_PFX_BASE64 != '' }}
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "lingdao.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'x64' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool not found" }
          & $signtool.FullName sign /f $pfx /p $env:PFX_PASS /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 target\release\lingdao.exe
          if ($LASTEXITCODE -ne 0) { throw "sign app failed" }

      - name: Portable zip
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/lingdao.exe dist/LingDao.exe -Force
          Compress-Archive -Path dist/LingDao.exe -DestinationPath "dist/LingDao-$v-portable.zip" -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "installer\LingDao.iss"
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }

      - name: Code sign installer (optional)
        if: ${{ secrets.WINDOWS_PFX_BASE64 != '' }}
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "lingdao.pfx"
          if (!(Test-Path $pfx)) { [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64)) }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'x64' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool not found" }
          & $signtool.FullName sign /f $pfx /p $env:PFX_PASS /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "dist\LingDao-Setup-${{ steps.ver.outputs.version }}.exe"
          if ($LASTEXITCODE -ne 0) { throw "sign setup failed" }

      - name: Write latest.json
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $exe = "dist/LingDao-Setup-$v.exe"
          if (!(Test-Path $exe)) { throw "missing $exe" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item $exe).Length
          $notes = "i岛 v$v"
          $obj = [ordered]@{
            version   = $v
            notes     = $notes
            url       = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/LingDao-Setup-$v.exe"
            sha256    = $hash
            size      = $size
            mandatory = $false
            pub_date  = (Get-Date -Format 'yyyy-MM-dd')
          }
          $json = $obj | ConvertTo-Json
          [IO.File]::WriteAllText("dist/latest.json", $json, (New-Object Text.UTF8Encoding($false)))
          Get-Content dist/latest.json

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: i岛 v${{ steps.ver.outputs.version }}
          files: |
            dist/LingDao-Setup-*.exe
            dist/LingDao-*-portable.zip
            dist/latest.json
          fail_on_unmatched_files: true
