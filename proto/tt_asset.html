<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:transparent;}
.tt{position:relative;width:540px;height:540px}
.ttsvg{width:100%;height:100%;display:block}
.discRot{}
</style></head><body>
<div class="tt" id="tt">
<svg class="ttsvg" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
<defs>
<radialGradient id="platter" cx="50%" cy="38%" r="72%"><stop offset="0" stop-color="#1c222b"/><stop offset="1" stop-color="#090c11"/></radialGradient>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc8f4"/><stop offset="0.55" stop-color="#bfe6ff"/><stop offset="1" stop-color="#eaf7ff"/></linearGradient>
<radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fffdf2"/><stop offset="0.55" stop-color="#ffe9a8"/><stop offset="1" stop-color="#ffd97a" stop-opacity="0"/></radialGradient>
<linearGradient id="hill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a7dccb"/><stop offset="1" stop-color="#5fae95"/></linearGradient>
<linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".30"/><stop offset="0.38" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity=".20"/></linearGradient>
<clipPath id="discClip"><circle cx="90" cy="90" r="66"/></clipPath>
<linearGradient id="armMetal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6fafd"/><stop offset="0.5" stop-color="#c3cdd8"/><stop offset="1" stop-color="#8894a2"/></linearGradient>
<radialGradient id="pivotGrad" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#e2e9f1"/><stop offset="0.5" stop-color="#9aa6b4"/><stop offset="1" stop-color="#525d69"/></radialGradient>
<linearGradient id="headGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6edf4"/><stop offset="1" stop-color="#96a1ae"/></linearGradient>
</defs>
<circle id="platterC" cx="90" cy="90" r="68" fill="url(#platter)" stroke="rgba(255,255,255,.08)"/>
<g class="discRot" id="discRot">
<g clip-path="url(#discClip)">
<rect x="24" y="24" width="132" height="132" fill="url(#sky)"/>
<circle cx="122" cy="54" r="27" fill="url(#sun)"/>
<circle cx="122" cy="54" r="10.5" fill="#fffbe6"/>
<ellipse cx="58" cy="58" rx="21" ry="7" fill="#ffffff" opacity=".92"/>
<ellipse cx="74" cy="65" rx="15" ry="6" fill="#ffffff" opacity=".85"/>
<ellipse cx="116" cy="90" rx="19" ry="6" fill="#ffffff" opacity=".8"/>
<path d="M24 134 Q 58 110 94 128 T 156 118 L156 156 L24 156 Z" fill="url(#hill)" opacity=".92"/>
<path d="M24 142 Q 70 124 110 138 T 156 134 L156 156 L24 156 Z" fill="#3f8f78" opacity=".55"/>
<text x="90" y="112" text-anchor="middle" font-size="18" font-weight="800" fill="#2a4b5e" letter-spacing="3" font-family="Microsoft YaHei,sans-serif">晴天</text>
<text x="90" y="126" text-anchor="middle" font-size="7" fill="#35586b" letter-spacing="1.2" font-family="Microsoft YaHei,sans-serif">周杰伦 · 叶惠美</text>
</g>
<g clip-path="url(#discClip)" opacity=".5">
<circle cx="90" cy="90" r="61" fill="none" stroke="rgba(255,255,255,.10)" stroke-width=".7"/>
<circle cx="90" cy="90" r="49" fill="none" stroke="rgba(255,255,255,.10)" stroke-width=".6"/>
<circle cx="90" cy="90" r="37" fill="none" stroke="rgba(255,255,255,.09)" stroke-width=".6"/>
</g>
<circle cx="90" cy="90" r="66" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="1"/>
</g>
<circle id="glossC" cx="90" cy="90" r="66" clip-path="url(#discClip)" fill="url(#gloss)"/>
<circle id="hub1" cx="90" cy="90" r="3.1" fill="#0b0e13"/>
<circle id="hub2" cx="90" cy="90" r="1.1" fill="#6b7784"/>
<g transform="translate(-12,0)" id="armWrap">
<circle id="base1" cx="158" cy="20" r="13" fill="url(#pivotGrad)" stroke="#3a444f" stroke-width=".8"/>
<circle id="base2" cx="158" cy="20" r="9.2" fill="none" stroke="rgba(255,255,255,.28)" stroke-width=".7"/>
<circle id="base3" cx="158" cy="20" r="5.6" fill="#2a333d"/>
<circle id="base4" cx="158" cy="20" r="2.4" fill="#cfd8e2"/>
<g class="armGroup" id="arm">
<path d="M157 24 C156 34 153 43 152 50 L139.3 70.3" fill="none" stroke="#000" stroke-opacity=".22" stroke-width="4.0" stroke-linecap="round"/>
<path d="M157 24 C156 34 153 43 152 50 L139.3 70.3" fill="none" stroke="url(#armMetal)" stroke-width="2.5" stroke-linecap="round"/>
<path d="M157 24 C156 34 153 43 152 50 L139.3 70.3" fill="none" stroke="#ffffff" stroke-opacity=".5" stroke-width=".7" stroke-linecap="round" transform="translate(-.5,-.6)"/>
<g transform="translate(139.3,70.3) rotate(121)">
<rect x="0" y="-4.4" width="15" height="8.8" rx="2.4" fill="url(#headGrad)" stroke="#5a646f" stroke-width=".6"/>
<rect x="0" y="-4.4" width="3" height="8.8" rx="1.2" fill="#c2ccd7" opacity=".9"/>
</g>
</g>
</g>
</svg>
</div>
<script>
var q=location.search||''; var paused=q.indexOf('pause=1')>=0;
var layerArm=q.indexOf('layer=arm')>=0, layerBase=q.indexOf('layer=base')>=0;
var deg = paused ? -41 : -15;
if(layerArm) deg = 0; // 参考姿态：0°，由 egui 旋转到目标角
var arm=document.getElementById('arm'); if(arm) arm.setAttribute('transform','rotate('+deg+' 158 20)');
var hide=function(ids){ids.forEach(function(id){var e=document.getElementById(id); if(e) e.style.display='none';});};
if(layerArm||layerBase){ hide(['platterC','discRot','glossC','hub1','hub2']); }
if(layerArm){ hide(['base1','base2','base3','base4']); }
if(layerBase){ hide(['arm']); }
</script>
</body></html>
