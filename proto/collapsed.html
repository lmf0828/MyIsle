<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>灵岛 · 收起态 · 播放演示</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b0e13;
    font-family:"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:60px}
  .cap{color:#6f7a89;font-size:12.5px;margin-bottom:16px}
  .desktop{position:relative;width:1100px;height:170px;border-radius:16px;overflow:hidden;
    background:
      radial-gradient(600px 220px at 50% -40%, rgba(57,199,255,.18), transparent 60%),
      radial-gradient(600px 260px at 85% 120%, rgba(47,214,166,.12), transparent 60%),
      linear-gradient(180deg,#141a24,#0c1016);
    border:1px solid rgba(255,255,255,.06);
    display:flex;justify-content:center;align-items:flex-start}
  .desktop::after{content:"模拟桌面背景";position:absolute;right:14px;bottom:10px;font-size:11px;color:rgba(255,255,255,.16)}
  .pill{display:inline-flex;align-items:center;gap:10px;height:34px;max-width:322px;width:max-content;
    padding:0 12px;border-radius:0 0 17px 17px;background:linear-gradient(180deg,#20262f,#171c24);
    border:1px solid rgba(255,255,255,.08);border-top:0;
    box-shadow:0 8px 24px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04);
    justify-content:center;overflow:hidden;color:#eef3f9;font-size:13.5px}
  .marquee{overflow:hidden;white-space:nowrap;max-width:236px;flex:0 1 auto;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 10px,#000 calc(100% - 10px),transparent)}
  .mrun{display:inline-flex;white-space:nowrap}
  .mrun span{padding-right:28px}
  .eq{display:inline-flex;align-items:flex-end;gap:2.5px;height:14px;flex:0 0 auto}
  .eq i{width:2.5px;background:#2fd6a6;border-radius:2px;animation:eq 1s ease-in-out infinite}
  .eq i:nth-child(2){animation-delay:.25s}
  .eq i:nth-child(3){animation-delay:.5s}
  @keyframes eq{0%,100%{height:4px}50%{height:14px}}
  .clock{font-variant-numeric:tabular-nums;font-weight:600;color:#dfe6ef;flex:0 0 auto}
  .dot{width:6px;height:6px;border-radius:50%;background:#2fd6a6;box-shadow:0 0 8px #2fd6a6;flex:0 0 auto}
</style>
</head>
<body>
  <div class="cap">收起态 · 贴顶刘海胶囊（滚动显示当前歌词，右侧跳动频谱 + 时间）</div>
  <div class="desktop">
    <div class="pill">
      <div class="marquee"><div class="mrun" id="run"><span id="ly">故事的小黄花 从出生那年就飘着</span></div></div>
      <div class="eq"><i></i><i></i><i></i></div>
      <div class="clock" id="clock">14:32</div>
    </div>
  </div>
<script>
const LINES=[
  '从前从前 有个人爱你很久',
  '但偏偏 风渐渐 把距离吹得好远',
  '故事的小黄花 从出生那年就飘着',
  '为你翘课的那一天 花落的那一天',
  '消失的下雨天 我好想再淋一遍'
];
const params=new URLSearchParams(location.search);
const det=params.get('t');
const run=document.getElementById('run');
const ly=document.getElementById('ly'), clock=document.getElementById('clock');
function setLine(text, long){
  run.innerHTML='';
  const mk=t=>{const s=document.createElement('span');s.textContent=t;return s;};
  run.appendChild(mk(text));
  if(long){ run.appendChild(mk(text)); run.classList.add('long'); } else run.classList.remove('long');
}
// marquee animation for long lines
const st=document.createElement('style');
st.textContent='.mrun.long{animation:scrollx 9s linear infinite}@keyframes scrollx{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}';
document.head.appendChild(st);
function update(t){
  const i=Math.floor(t/3.2)%LINES.length;
  const line=LINES[i];
  setLine(line, line.length>18);
  const sec=Math.floor(t);
  const mm=14, ss=(32+sec)%60;
  clock.textContent='14:'+String(ss).padStart(2,'0');
}
if(det!==null){ update(parseFloat(det)||0); }
else{ let t=0,last=performance.now(); requestAnimationFrame(function loop(now){ t+=(now-last)/1000; last=now; update(t); requestAnimationFrame(loop); }); }
</script>
</body>
</html>
