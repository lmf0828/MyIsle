<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>WinIsle · 收起态频谱样式选择</title>
<style>
  :root{
    --bg:#0e0f13; --card:#17191f; --card2:#1c1e25; --line:#2a2d36;
    --text:#e9eaee; --muted:#9aa1b0; --muted2:#6b7280; --accent:#34d399;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#191c24 0%,var(--bg) 60%);
    color:var(--text);font-family:"Microsoft YaHei","Segoe UI",system-ui,sans-serif;padding:34px 40px 60px;}
  h1{font-size:22px;margin:0 0 6px;font-weight:700;letter-spacing:.5px;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:26px;}
  .stage{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:18px 20px;margin-bottom:28px;}
  .stage .label{font-size:12px;color:var(--muted2);writing-mode:vertical-rl;letter-spacing:2px;}
  .pillbig{width:600px;height:120px;border-radius:28px;background:#1c1c22;position:relative;overflow:hidden;
    box-shadow:0 8px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.03);}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;max-width:1080px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px 16px;
    cursor:pointer;transition:.18s border-color,.18s transform,.18s background;position:relative;}
  .card:hover{border-color:#3b4150;background:var(--card2);transform:translateY(-2px);}
  .card.sel{border-color:var(--accent);box-shadow:0 0 0 1px rgba(52,211,153,.35),0 8px 26px rgba(16,185,129,.12);}
  .card .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .card .name{font-size:14px;font-weight:600;}
  .card .tag{font-size:11px;color:var(--muted2);}
  .card.sel .tag{color:var(--accent);}
  .card canvas{width:100%;height:66px;display:block;border-radius:9px;background:#1c1c22;}
  .card .desc{font-size:11.5px;color:var(--muted);margin-top:9px;line-height:1.5;}
  .foot{margin-top:26px;color:var(--muted2);font-size:12px;}
  .badge{display:inline-block;font-size:11px;color:#0b1210;background:var(--accent);border-radius:6px;padding:2px 7px;margin-left:8px;font-weight:700;}
</style>
</head>
<body>
  <h1>收起态频谱 · 样式方案</h1>
  <div class="sub">下面每种都是真实动画（用 120BPM 模拟鼓点律动）。点一个你喜欢的，右上角即为实机 2 倍大小的效果。</div>

  <div class="stage">
    <div class="label">实机效果</div>
    <div class="pillbig"><canvas id="big" width="600" height="120" style="width:600px;height:120px;"></canvas></div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="foot">确定后我会把它做进设置页（“频谱样式”），并可随时切换。</div>

<script>
const styles=[
  {id:'bars',  name:'① 经典柱状', tag:'当前', desc:'4 根圆角柱随鼓点起伏，简洁利落。'},
  {id:'dense', name:'② 细密均衡器', tag:'细腻', desc:'6 根细柱高低错落，更像专业播放器 EQ。'},
  {id:'wave',  name:'③ 迷你波形', tag:'流动', desc:'一条随音量起伏的波形线，柔和连续。'},
  {id:'pulse', name:'④ 呼吸脉冲', tag:'极简', desc:'一个圆点随鼓点扩散出光环，安静有节奏。'},
  {id:'dots',  name:'⑤ 弹跳圆点', tag:'俏皮', desc:'3 个圆点上下弹跳，轻快活泼。'},
  {id:'mirror',name:'⑥ 对称镜像', tag:'动感', desc:'以中线为轴上下对称跳动，冲击感强。'},
];
const grid=document.getElementById('grid');
const big=document.getElementById('big');
let selected='bars';
for(const s of styles){
  const d=document.createElement('div');
  d.className='card'+(s.id===selected?' sel':'');
  d.dataset.id=s.id;
  d.innerHTML=`<div class="head"><span class="name">${s.name}</span><span class="tag">${s.tag}</span></div>
    <canvas width="520" height="132"></canvas>
    <div class="desc">${s.desc}</div>`;
  d.onclick=()=>{selected=s.id;[...grid.children].forEach(c=>c.classList.toggle('sel',c.dataset.id===selected));};
  grid.appendChild(d);
}

// ---- 模拟音频包络 ----
function env(t){
  // 120BPM 鼓点 + 轻微噪声，返回 [level 0..1, beat 0..1]
  const bp=(t*2.0)%1;
  const beat=Math.pow(1-bp,2.6);
  const slow=0.28+0.22*Math.sin(t*1.3)+0.14*Math.sin(t*2.7+1.1);
  const level=Math.min(1,Math.max(.08, slow*0.6+beat*0.7));
  return [level,beat];
}

function roundRect(ctx,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}

function drawPillBG(ctx,w,h){
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle='#1c1c22'; roundRect(ctx,0,0,w,h,Math.min(14,w*0.09)); ctx.fill();
}

function drawLyric(ctx,w,h,scale){
  ctx.fillStyle='rgba(233,234,238,0.85)';
  ctx.font=`${15*scale}px "Microsoft YaHei"`;
  ctx.textBaseline='middle';
  ctx.fillText('让寂寞的月光洒落我的窗', 56*scale, h/2+1);
}

function drawSpectrum(ctx,w,h,style,t,scale){
  const [level,beat]=env(t);
  const cy=h/2;
  const accent='#34d399';
  const g=ctx.createLinearGradient(0,cy-30*scale,0,cy+30*scale);
  g.addColorStop(0,'#5eead4'); g.addColorStop(.5,'#34d399'); g.addColorStop(1,'#10b981');
  ctx.save();

  if(style==='bars'||style==='dense'||style==='mirror'){
    const n = style==='bars'?4:(style==='dense'?6:5);
    const bw = style==='dense'?2.2*scale:3.2*scale;
    const gap= style==='dense'?1.5*scale:3.0*scale;
    const totalW=n*bw+(n-1)*gap;
    const x0=16*scale;
    const gains=Array.from({length:n},(_,k)=>0.55+0.45*Math.abs(Math.sin(k*1.7+1.2)));
    for(let k=0;k<n;k++){
      const wob=0.5+0.5*Math.sin(t*8.3+k*1.9);
      const hh=Math.min(24*scale, (2.2 + level*13*gains[k] + beat*9*gains[k] + wob*1.8)*scale/2.0 );
      const x=x0+k*(bw+gap);
      ctx.fillStyle=g;
      if(style==='mirror'){
        const half=hh*0.62;
        roundRect(ctx,x,cy-half,bw,half*2,bw/2);ctx.fill();
      }else{
        roundRect(ctx,x,cy-hh/2,bw,hh,bw/2);ctx.fill();
      }
    }
  } else if(style==='wave'){
    const x0=15*scale,x1=44*scale,N=26;
    ctx.strokeStyle=accent;ctx.lineWidth=2.0*scale;ctx.lineCap='round';
    ctx.beginPath();
    for(let i=0;i<=N;i++){
      const p=i/N; const x=x0+(x1-x0)*p;
      const envl=Math.sin(p*Math.PI); // 两端收窄
      const y=cy - Math.sin(p*9+t*9)*envl*(2+level*9+beat*7)*scale*0.55;
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.stroke();
  } else if(style==='pulse'){
    const cx=30*scale;
    const r0=(3.2+beat*4.5)*scale;
    ctx.fillStyle=accent;
    ctx.beginPath();ctx.arc(cx,cy,r0,0,7);ctx.fill();
    ctx.strokeStyle=`rgba(52,211,153,${0.55*(1-beat)})`;
    ctx.lineWidth=1.6*scale;
    ctx.beginPath();ctx.arc(cx,cy,(4+beat*9)*scale,0,7);ctx.stroke();
    ctx.strokeStyle=`rgba(52,211,153,${0.28*(1-beat)})`;
    ctx.beginPath();ctx.arc(cx,cy,(4+beat*15)*scale,0,7);ctx.stroke();
  } else if(style==='dots'){
    const n=3, r=2.6*scale, x0=22*scale, gap=8*scale;
    for(let k=0;k<n;k++){
      const ph=t*5.5+k*1.1;
      const yy=cy - Math.sin(ph)*(2+beat*7+level*4)*scale*0.5;
      ctx.fillStyle=accent;
      ctx.beginPath();ctx.arc(x0+k*gap,yy,r*(1+beat*0.3),0,7);ctx.fill();
    }
  }
  ctx.restore();
}

function renderCanvas(cv,style,scale){
  const ctx=cv.getContext('2d');
  const w=cv.width,h=cv.height;
  drawPillBG(ctx,w,h);
  drawSpectrum(ctx,w,h,style,performance.now()/1000,scale);
  drawLyric(ctx,w,h,scale);
}
// lyric scale differs: card canvas logical width 260 vs big 300
function renderCard(cv,style){
  const ctx=cv.getContext('2d');const w=cv.width,h=cv.height;
  drawPillBG(ctx,w,h);
  // card canvas is 520x132, roughly 2x of 260x66 -> treat scale 1.0 style sizes
  drawSpectrum(ctx,w,h,style,performance.now()/1000,1.75);
  ctx.fillStyle='rgba(233,234,238,0.8)';
  ctx.font='17px "Microsoft YaHei"';ctx.textBaseline='middle';
  ctx.fillText('让寂寞的月光洒落我的窗',66,h/2+1);
}
function loop(){
  renderCanvas(big,selected,2.0);
  [...grid.children].forEach(c=>renderCard(c.querySelector('canvas'),c.dataset.id));
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
