[package]
name = "myisle"
version = "0.2.1"
edition = "2021"
description = "MyIsle — 原创开源的 Windows 灵动岛桌面音乐伴侣"
license = "MIT"
repository = "https://github.com/lmf0828/MyIsle"
authors = ["MyIsle contributors"]

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
raw-window-handle = "0.6"
tray-icon = "0.19"
windows = { version = "0.58", features = ["Foundation", "Foundation_Collections", "Media_Control", "Storage_Streams", "Win32_Foundation", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Debug", "Win32_System_Memory", "Win32_System_Threading"] }
ureq = { version = "2.10", default-features = false, features = ["tls", "native-certs", "json", "gzip"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
