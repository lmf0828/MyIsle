<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  body{margin:0;background:#1d1e24;font-family:'Segoe UI',sans-serif;color:#e7eaf0;display:flex;flex-wrap:wrap;gap:28px;padding:36px;}
  .cell{background:#22242b;border-radius:16px;padding:22px 26px;width:300px;text-align:center;}

</style></head><body>

<!-- A 现行：暗色岛+绿点 -->
<div class="cell"><div>
<svg width="160" height="160" viewBox="0 0 128 128">
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#1b1c22" stroke="#ffffff14"/>
  <rect x="22" y="48" width="84" height="32" rx="16" fill="#2a2c35"/>
  <circle cx="92" cy="64" r="7" fill="#34d399"/>
</svg></div>
<div class="row">
  <div class="small-dark">
    <svg width="48" height="48" viewBox="0 0 128 128"><rect x="4" y="4" width="120" height="120" rx="28" fill="#1b1c22"/><rect x="22" y="48" width="84" height="32" rx="16" fill="#2a2c35"/><circle cx="92" cy="64" r="7" fill="#34d399"/></svg>

    <svg width="32" height="32" viewBox="0 0 128 128"><rect x="4" y="4" width="120" height="120" rx="28" fill="#1b1c22"/><rect x="22" y="48" width="84" height="32" rx="16" fill="#2a2c35"/><circle cx="92" cy="64" r="7" fill="#34d399"/></svg>
  </div>
</div>
<div class="lab">A · 现行方案（暗岛 + 绿点）</div></div>

<!-- D 清新渐变 + 白岛 -->
<div class="cell"><div>
<svg width="160" height="160" viewBox="0 0 128 128">
  <defs><linearGradient id="dg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#0ea5e9"/>
  </linearGradient></defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#dg)"/>
  <rect x="24" y="50" width="80" height="28" rx="14" fill="#ffffff"/>
  <circle cx="90" cy="64" r="6" fill="#34d399"/>
