<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  body{margin:0;background:#1d1e24;font-family:'Segoe UI',sans-serif;color:#e7eaf0;display:flex;flex-wrap:wrap;gap:28px;padding:36px;}
  .cell{background:#22242b;border-radius:16px;padding:22px 26px;width:300px;text-align:center;}
  .row{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:14px;}
  .lab{margin-top:12px;font-size:15px;color:#9aa3b2;}
  .small-dark{background:#101116;border-radius:12px;padding:10px;display:flex;gap:12px;align-items:center;}
  .small-light{background:#f2f4f8;border-radius:12px;padding:10px;display:flex;gap:12px;align-items:center;}
</style></head><body>

<!-- G 点 → 岛（收缩态与展开态同框） -->
<div class="cell"><div>
<svg width="160" height="160" viewBox="0 0 128 128">
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#1b1c22" stroke="#ffffff14"/>
  <circle cx="36" cy="64" r="9" fill="#34d399"/>
  <rect x="56" y="46" width="48" height="36" rx="18" fill="none" stroke="#34d399" stroke-width="3"/>
</svg></div>
<div class="row">
  <div class="small-dark">
    <svg width="48" height="48" viewBox="0 0 128 128"><rect x="4" y="4" width="120" height="120" rx="28" fill="#1b1c22"/><circle cx="36" cy="64" r="9" fill="#34d399"/><rect x="56" y="46" width="48" height="36" rx="18" fill="none" stroke="#34d399" stroke-width="3"/></svg>
    <svg width="32" height="32" viewBox="0 0 128 128"><rect x="4" y="4" width="120" height="120" rx="28" fill="#1b1c22"/><circle cx="36" cy="64" r="9" fill="#34d399"/><rect x="56" y="46" width="48" height="36" rx="18" fill="none" stroke="#34d399" stroke-width="3"/></svg>
  </div>
  <div class="small-light">
    <svg width="48" height="48" viewBox="0 0 128 128"><rect x="4" y="4" width="120" height="120" rx="28" fill="#1b1c22"/><circle cx="36" cy="64" r="9" fill="#34d399"/><rect x="56" y="46" width="48" height="36" rx="18" fill="none" stroke="#34d399" stroke-width="3"/></svg>
    <svg width="32" height="32" viewBox="0 0 128 128"><rect x="4" y="4" width="120" height="120" rx="28" fill="#1b1c22"/><circle cx="36" cy="64" r="9" fill="#34d399"/><rect x="56" y="46" width="48" height="36" rx="18" fill="none" stroke="#34d399" stroke-width="3"/></svg>
  </div>
</div>
<div class="lab">G · 点→岛（收缩与展开同框）</div></div>

  <div class="small-light">

<div class="cell"><div>
<svg width="160" height="160" viewBox="0 0 128 128">

<!-- K 声波扩散 -->
<div class="cell"><div>
<svg width="160" height="160" viewBox="0 0 128 128">

<div class="row">

<!-- L 渐变底 + 岛展开拖尾 -->
<div class="cell"><div>

  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#lg)"/>
  <rect x="22" y="50" width="58" height="28" rx="14" fill="#ffffff"/>
  <circle cx="92" cy="64" r="6" fill="#ffffff" fill-opacity="0.75"/>
  <circle cx="106" cy="64" r="3.5" fill="#ffffff" fill-opacity="0.45"/>
