<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>WinIsle · 自信 + 下方名字</title>
<style>
  :root{ --bg:#0d0e12; --card:#14161c; --line:#242a33; --ink:#e8ebf2; --mut:#8b93a3; --acc:#34d399; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
  .wrap{max-width:780px;margin:0 auto;padding:38px 24px 50px;}
  header{text-align:center;margin-bottom:20px}
  header h1{font-size:21px;margin:0 0 8px}
  header p{margin:0;color:var(--mut);font-size:12.5px;line-height:1.6}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;text-align:center}
  .big{width:180px;height:180px;margin-bottom:4px}
  .big svg{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 22px rgba(0,0,0,.45))}
  .name{font-size:12.5px;font-weight:700;margin:6px 0 2px}
  .desc{font-size:10.5px;color:var(--mut);line-height:1.45}
  .row{display:flex;align-items:center;gap:10px;margin-top:8px}
  .row .lbl{font-size:10px;color:var(--mut)}
  .rec{position:relative}
  .rec:before{content:"推荐";position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--acc);color:#08110d;font-size:10px;font-weight:800;border-radius:999px;padding:2px 9px;letter-spacing:1px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>WinIsle 图标 · 自信 + 下方软件名</h1>
    <p>在图标下方加上“WinIsle”字样。三种文字处理，你选一个。</p>
  </header>
  <div class="grid">

    <!-- 1 白字 -->
    <div class="card rec">
      <div class="big"><svg viewBox="0 0 128 128">
        <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient></defs>
        <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#g1)"/>
        <g transform="rotate(-8 64 46)">
          <rect x="24" y="26" width="80" height="40" rx="20" fill="#0b0f14"/>
          <image href="confident_mint.png" x="29" y="33.2" width="70" height="21.6"/>
        </g>
        <text x="64" y="96" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-weight="800" font-size="18" letter-spacing="0.3" fill="#ffffff">WinIsle</text>
      </svg></div>
      <div class="name">白字 WinIsle</div>
      <div class="desc">名字用白色，压在下方蓝色上，清爽。推荐。</div>
      <div class="row"><span class="lbl">小尺寸</span>
        <svg width="48" height="48" viewBox="0 0 128 128"><defs><linearGradient id="s1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient></defs><rect x="4" y="4" width="120" height="120" rx="28" fill="url(#s1)"/><g transform="rotate(-8 64 46)"><rect x="24" y="26" width="80" height="40" rx="20" fill="#0b0f14"/><image href="confident_mint.png" x="29" y="33.2" width="70" height="21.6"/></g><text x="64" y="96" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-weight="800" font-size="18" letter-spacing="0.3" fill="#ffffff">WinIsle</text></svg>
        <svg width="32" height="32" viewBox="0 0 128 128"><defs><linearGradient id="s2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient></defs><rect x="4" y="4" width="120" height="120" rx="28" fill="url(#s2)"/><g transform="rotate(-8 64 46)"><rect x="24" y="26" width="80" height="40" rx="20" fill="#0b0f14"/><image href="confident_mint.png" x="29" y="33.2" width="70" height="21.6"/></g><text x="64" y="96" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-weight="800" font-size="18" letter-spacing="0.3" fill="#ffffff">WinIsle</text></svg>
      </div>
    </div>

    <!-- 2 深色字 -->
    <div class="card">
      <div class="big"><svg viewBox="0 0 128 128">
        <defs><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient></defs>
        <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#g2)"/>
        <g transform="rotate(-8 64 46)">
          <rect x="24" y="26" width="80" height="40" rx="20" fill="#0b0f14"/>
          <image href="confident_mint.png" x="29" y="33.2" width="70" height="21.6"/>
        </g>
        <text x="64" y="96" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-weight="800" font-size="18" letter-spacing="0.3" fill="#06231a">WinIsle</text>
      </svg></div>
      <div class="name">深色字 WinIsle</div>
      <div class="desc">名字用深墨绿，和岛同色系，整体统一。</div>
      <div class="row"><span class="lbl">小尺寸</span>
        <svg width="48" height="48" viewBox="0 0 128 128"><defs><linearGradient id="s3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient></defs><rect x="4" y="4" width="120" height="120" rx="28" fill="url(#s3)"/><g transform="rotate(-8 64 46)"><rect x="24" y="26" width="80" height="40" rx="20" fill="#0b0f14"/><image href="confident_mint.png" x="29" y="33.2" width="70" height="21.6"/></g><text x="64" y="96" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-weight="800" font-size="18" letter-spacing="0.3" fill="#06231a">WinIsle</text></svg>
        <svg width="32" height="32" viewBox="0 0 128 128"><defs><linearGradient id="s4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient></defs><rect x="4" y="4" width="120" height="120" rx="28" fill="url(#s4)"/><g transform="rotate(-8 64 46)"><rect x="24" y="26" width="80" height="40" rx="20" fill="#0b0f14"/><image href="confident_mint.png" x="29" y="33.2" width="70" height="21.6"/></g><text x="64" y="96" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-weight="800" font-size="18" letter-spacing="0.3" fill="#06231a">WinIsle</text></svg>
      </div>
    </div>

    <!-- 3 白字 + 留白更多 -->
    <div class="card">
      <div class="big"><svg viewBox="0 0 128 128">
        <defs><linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient></defs>
        <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#g3)"/>
        <g transform="rotate(-8 64 42)">
          <rect x="27" y="24" width="74" height="36" rx="18" fill="#0b0f14"/>
          <image href="confident_mint.png" x="32" y="30.6" width="64" height="19.75"/>
        </g>
        <text x="64" y="98" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-weight="800" font-size="17" letter-spacing="0.3" fill="#ffffff">WinIsle</text>
      </svg></div>
      <div class="name">白字 · 多留白</div>
      <div class="desc">岛略缩、上移，名字和岛之间更透气。</div>
      <div class="row"><span class="lbl">小尺寸</span>
        <svg width="48" height="48" viewBox="0 0 128 128"><defs><linearGradient id="s5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient></defs><rect x="4" y="4" width="120" height="120" rx="28" fill="url(#s5)"/><g transform="rotate(-8 64 42)"><rect x="27" y="24" width="74" height="36" rx="18" fill="#0b0f14"/><image href="confident_mint.png" x="32" y="30.6" width="64" height="19.75"/></g><text x="64" y="98" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-weight="800" font-size="17" letter-spacing="0.3" fill="#ffffff">WinIsle</text></svg>
        <svg width="32" height="32" viewBox="0 0 128 128"><defs><linearGradient id="s6" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient></defs><rect x="4" y="4" width="120" height="120" rx="28" fill="url(#s6)"/><g transform="rotate(-8 64 42)"><rect x="27" y="24" width="74" height="36" rx="18" fill="#0b0f14"/><image href="confident_mint.png" x="32" y="30.6" width="64" height="19.75"/></g><text x="64" y="98" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-weight="800" font-size="17" letter-spacing="0.3" fill="#ffffff">WinIsle</text></svg>
      </div>
    </div>

  </div>
</div>
</body>
</html>
