<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>WinIsle 图标 · 上下对半 + 上半刘海</title>
<style>
  :root{ --bg:#0d0e12; --card:#14161c; --line:#242a33; --ink:#e8ebf2; --mut:#8b93a3; --acc:#34d399; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
  .wrap{max-width:900px;margin:0 auto;padding:40px 28px 56px;}
  header{text-align:center;margin-bottom:24px}
  header h1{font-size:24px;margin:0 0 10px;letter-spacing:.5px}
  header p{margin:0;color:var(--mut);font-size:13px;line-height:1.7}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 18px 16px;display:flex;flex-direction:column;align-items:center;text-align:center}
  .big{width:190px;height:190px;margin-bottom:6px}
  .big svg{width:100%;height:100%;display:block;filter:drop-shadow(0 12px 26px rgba(0,0,0,.45))}
  .name{font-size:14px;font-weight:700;margin:6px 0 3px}
  .desc{font-size:12px;color:var(--mut);line-height:1.55;max-width:240px}
  .row{display:flex;align-items:center;gap:12px;margin-top:10px}
  .row .lbl{font-size:10.5px;color:var(--mut)}
  .recdot{position:relative}
  .recdot:before{content:"推荐";position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--acc);color:#08110d;font-size:11px;font-weight:800;border-radius:999px;padding:3px 10px;letter-spacing:1px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="grn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2ee6a6"/><stop offset="1" stop-color="#12b981"/></linearGradient>
  <linearGradient id="grnV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3ae7b2"/><stop offset="1" stop-color="#12b981"/></linearGradient>
</defs></svg>

<div class="wrap">
  <header>
    <h1>WinIsle 图标 · 上下对半分</h1>
    <p>图标横切一半：上半个就是“刘海”——通栏、底部两边收圆角，名字 WinIsle 写在上半个正中；<br>下半是纯底色。这版按你红线画的位置来。</p>
  </header>

  <div class="grid">

    <!-- V1 深底亮绿上半 -->
    <div class="card recdot">
      <div class="big"><svg viewBox="0 0 256 256">
        <defs><clipPath id="d1"><rect x="8" y="8" width="240" height="240" rx="56"/></clipPath></defs>
        <g clip-path="url(#d1)">
          <rect x="8" y="8" width="240" height="240" fill="#14171f"/>
          <path d="M8 8 L248 8 L248 98 Q248 128 218 128 L38 128 Q8 128 8 98 Z" fill="url(#grnV)"/>
        </g>
        <rect x="8.5" y="8.5" width="239" height="239" rx="55.5" fill="none" stroke="rgba(255,255,255,0.07)"/>
        <text x="128" y="69" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-weight="800" font-size="41" letter-spacing="0.3" fill="#06231a">WinIsle</text>
      </svg></div>
      <div class="name">深底 · 绿水滴上盖</div>
      <div class="desc">深色方底，上半个亮绿，名字深色压在绿上。对比清楚、最像产品图标。</div>
      <div class="row">
        <span class="lbl">小尺寸</span>
        <svg width="32" height="32" viewBox="0 0 256 256"><g clip-path="url(#d1)"><rect x="8" y="8" width="240" height="240" fill="#14171f"/><path d="M8 8 L248 8 L248 98 Q248 128 218 128 L38 128 Q8 128 8 98 Z" fill="url(#grnV)"/></g></svg>
        <svg width="22" height="22" viewBox="0 0 256 256"><g clip-path="url(#d1)"><rect x="8" y="8" width="240" height="240" fill="#14171f"/><path d="M8 8 L248 8 L248 98 Q248 128 218 128 L38 128 Q8 128 8 98 Z" fill="url(#grnV)"/></g></svg>
      </div>
    </div>

    <!-- V2 深底深灰上半 绿字 -->
    <div class="card">
      <div class="big"><svg viewBox="0 0 256 256">
        <defs><clipPath id="d2"><rect x="8" y="8" width="240" height="240" rx="56"/></clipPath></defs>
        <g clip-path="url(#d2)">
          <rect x="8" y="8" width="240" height="240" fill="#0f1116"/>
          <path d="M8 8 L248 8 L248 98 Q248 128 218 128 L38 128 Q8 128 8 98 Z" fill="#1e242e"/>
        </g>
        <rect x="8.5" y="8.5" width="239" height="239" rx="55.5" fill="none" stroke="rgba(255,255,255,0.07)"/>
        <text x="128" y="69" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-weight="800" font-size="41" letter-spacing="0.3" fill="#34d399">WinIsle</text>
      </svg></div>
      <div class="name">深底 · 深灰上盖</div>
      <div class="desc">上盖略亮的深灰，名字用品牌绿。低调耐看、层次含蓄。</div>
      <div class="row">
        <span class="lbl">小尺寸</span>
        <svg width="32" height="32" viewBox="0 0 256 256"><g clip-path="url(#d2)"><rect x="8" y="8" width="240" height="240" fill="#0f1116"/><path d="M8 8 L248 8 L248 98 Q248 128 218 128 L38 128 Q8 128 8 98 Z" fill="#1e242e"/></g></svg>
        <svg width="22" height="22" viewBox="0 0 256 256"><g clip-path="url(#d2)"><rect x="8" y="8" width="240" height="240" fill="#0f1116"/><path d="M8 8 L248 8 L248 98 Q248 128 218 128 L38 128 Q8 128 8 98 Z" fill="#1e242e"/></g></svg>
      </div>
    </div>

    <!-- V3 绿底深色上半 -->
    <div class="card">
      <div class="big"><svg viewBox="0 0 256 256">
        <defs><clipPath id="d3"><rect x="8" y="8" width="240" height="240" rx="56"/></clipPath></defs>
        <g clip-path="url(#d3)">
          <rect x="8" y="8" width="240" height="240" fill="url(#grn)"/>
          <path d="M8 8 L248 8 L248 98 Q248 128 218 128 L38 128 Q8 128 8 98 Z" fill="#0e1217"/>
        </g>
        <rect x="8.5" y="8.5" width="239" height="239" rx="55.5" fill="none" stroke="rgba(0,0,0,0.18)"/>
        <text x="128" y="69" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-weight="800" font-size="41" letter-spacing="0.3" fill="#eafff6">WinIsle</text>
      </svg></div>
      <div class="name">绿底 · 深色上盖</div>
      <div class="desc">整体绿底，上半个深色、名字白色。反差最大、桌面最跳（也是你截图那套）。</div>
      <div class="row">
        <span class="lbl">小尺寸</span>
        <svg width="32" height="32" viewBox="0 0 256 256"><g clip-path="url(#d3)"><rect x="8" y="8" width="240" height="240" fill="url(#grn)"/><path d="M8 8 L248 8 L248 98 Q248 128 218 128 L38 128 Q8 128 8 98 Z" fill="#0e1217"/></g></svg>
        <svg width="22" height="22" viewBox="0 0 256 256"><g clip-path="url(#d3)"><rect x="8" y="8" width="240" height="240" fill="url(#grn)"/><path d="M8 8 L248 8 L248 98 Q248 128 218 128 L38 128 Q8 128 8 98 Z" fill="#0e1217"/></g></svg>
      </div>
    </div>

    <!-- V4 浅底深色上半 -->
    <div class="card">
      <div class="big"><svg viewBox="0 0 256 256">
        <defs><clipPath id="d4"><rect x="8" y="8" width="240" height="240" rx="56"/></clipPath></defs>
        <g clip-path="url(#d4)">
          <rect x="8" y="8" width="240" height="240" fill="#eef1f4"/>
          <path d="M8 8 L248 8 L248 98 Q248 128 218 128 L38 128 Q8 128 8 98 Z" fill="#10141a"/>
        </g>
        <rect x="8.5" y="8.5" width="239" height="239" rx="55.5" fill="none" stroke="rgba(0,0,0,0.10)"/>
        <text x="128" y="69" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-weight="800" font-size="41" letter-spacing="0.3" fill="#ffffff">WinIsle</text>
      </svg></div>
      <div class="name">浅底 · 深色上盖</div>
      <div class="desc">浅灰白底 + 深色上盖、名字白色。清爽、系统原生风。</div>
      <div class="row">
        <span class="lbl">小尺寸</span>
        <svg width="32" height="32" viewBox="0 0 256 256"><g clip-path="url(#d4)"><rect x="8" y="8" width="240" height="240" fill="#eef1f4"/><path d="M8 8 L248 8 L248 98 Q248 128 218 128 L38 128 Q8 128 8 98 Z" fill="#10141a"/></g></svg>
        <svg width="22" height="22" viewBox="0 0 256 256"><g clip-path="url(#d4)"><rect x="8" y="8" width="240" height="240" fill="#eef1f4"/><path d="M8 8 L248 8 L248 98 Q248 128 218 128 L38 128 Q8 128 8 98 Z" fill="#10141a"/></g></svg>
      </div>
    </div>

  </div>
</div>
</body>
</html>
